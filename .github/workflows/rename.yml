name: Rename exercise-browser.html to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file and remove this workflow
        run: |
          set -e
          git config user.name "wyattyhh"
          git config user.email "wyattyhh@users.noreply.github.com"
          git mv exercise-browser.html index.html
          git rm -q .github/workflows/rename.yml
          git commit -q -m "Rename exercise-browser.html to index.html"
          git push -q origin HEAD:main
