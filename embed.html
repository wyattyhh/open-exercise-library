<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise — embed</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;background:#fff;line-height:1.5}
  @media (prefers-color-scheme:dark){body{color:#eee;background:#1b1b1b}body .chip{background:#2a2a2a}body .cue,body .mistake{background:#262626}body a{color:#8ab4f8}}
  .card{max-width:560px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:0 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .chip{font-size:12px;background:#f0f0f0;border-radius:999px;padding:2px 10px}
  .gif-wrap{text-align:center;margin-bottom:12px}
  .gif-wrap img{max-width:100%;height:auto;border-radius:12px}
  .no-gif{font-size:14px;color:#777;border:1px dashed #bbb;border-radius:12px;padding:20px;text-align:center}
  h2{font-size:15px;margin:16px 0 6px}
  ol{margin:0;padding-left:20px}
  li{margin-bottom:4px}
  .session{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:15px;font-weight:600;background:#e8f0fe}
  @media (prefers-color-scheme:dark){.session{background:#26374d}}
  .cue,.mistake{border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
  .cue{background:#eef6ee}.mistake{background:#fdf0ee}
  .src{margin-top:14px;font-size:12px;color:#888}
  .src a{color:inherit}
  .err{padding:24px;font-size:15px}
</style>
</head>
<body>
<div class="card" id="app">Loading…</div>
<script src="embed-custom.js"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var slug = (params.get('ex') || '').toLowerCase();
  var app = document.getElementById('app');
  var esc = function(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };

  function loadFullDataFallback() {
    // Only used when a per-exercise file is missing (e.g. an old URL).
    // embed-data.js defines window.EMBED_EXERCISES.
    return new Promise(function(resolve){
      var s = document.createElement('script');
      s.src = 'embed-data.js';
      s.onload = function(){ resolve(window.EMBED_EXERCISES || {}); };
      s.onerror = function(){ resolve({}); };
      document.head.appendChild(s);
    });
  }

  function findEx() {
    var custom = window.EMBED_CUSTOM || {};
    if (slug && custom[slug]) return Promise.resolve(custom[slug]);
    if (slug) {
      // Fast path: one tiny per-exercise file (~1 KB), not the whole dataset.
      return fetch('embed-data/' + encodeURIComponent(slug) + '.json')
        .then(function(r){ if (!r.ok) throw new Error('not found'); return r.json(); })
        .then(function(ex){
          if (custom[slug]) return custom[slug];
          return ex;
        })
        .catch(function(){
          return loadFullDataFallback().then(function(all){
            return all[slug] || custom[slug] || null;
          });
        });
    }
    if (params.get('id')) {
      // Resolve the id through the small index, then load that one file.
      return fetch('embed-data/index.json')
        .then(function(r){ return r.json(); })
        .then(function(index){
          var s = index[params.get('id')];
          if (!s) return null;
          if (custom[s]) return custom[s];
          return fetch('embed-data/' + encodeURIComponent(s) + '.json').then(function(r){ return r.json(); });
        })
        .catch(function(){ return null; });
    }
    return Promise.resolve(null);
  }

  findEx().then(function(ex){
    if (!ex) {
      app.innerHTML = '<div class="err">Exercise not found. Add <code>?ex=&lt;slug&gt;</code> to the URL, e.g. <code>?ex=push-up</code>.</div>';
      return;
    }
    document.title = ex.name + ' — exercise';
    var gif = '';
    if (ex.gif_file) {
      var base = 'videos/' + ex.gif_file;
      var mirrors = [
        'https://cdn.jsdelivr.net/gh/wyattyhh/exercises-dataset@main/' + base,
        'https://gcore.jsdelivr.net/gh/wyattyhh/exercises-dataset@main/' + base,
        'https://fastly.jsdelivr.net/gh/wyattyhh/exercises-dataset@main/' + base,
        'https://raw.githubusercontent.com/wyattyhh/exercises-dataset/main/' + base,
        'https://github.com/wyattyhh/exercises-dataset/raw/main/' + base
      ];
      gif = '<div class="gif-wrap"><img src="' + mirrors[0] + '" alt="' + esc(ex.name) + ' animation" data-mirror="0" onerror="var m=JSON.parse(this.dataset.mirrors||\'[]\');var i=parseInt(this.dataset.mirror,10)+1;if(i<m.length){this.dataset.mirror=i;this.src=m[i];}"></div>';
      gif = gif.replace('data-mirror="0"', 'data-mirror="0" data-mirrors=\'' + JSON.stringify(mirrors).replace(/'/g, '') + '\'');
    } else {
      gif = '<div class="no-gif">No animation in the dataset for this exercise — follow the steps below.</div>';
    }
    var steps = (ex.steps || []).map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('');
    // Coaching notes can also travel with the embed itself:
    // ?cue= and ?mistake= win over anything stored in the project files.
    var cue = params.get('cue') || ex.cue;
    var mistake = params.get('mistake') || ex.mistake;
    var cueHtml = cue ? '<div class="cue"><b>Form cue:</b> ' + esc(cue) + '</div>' : '';
    var mistakeHtml = mistake ? '<div class="mistake"><b>Common mistake:</b> ' + esc(mistake) + '</div>' : '';
    var idHtml = ex.id ? ' · Dataset id: ' + esc(ex.id) : '';
    // Session info, from the URL: either a ready-made ?session= string, or
    // composed from ?sets= ?reps= ?work= ?duration= ?rest= ?note=
    // e.g. ?ex=push-up&sets=3&reps=10-15&rest=60-90s
    var session = params.get('session') || '';
    if (!session) {
      var parts = [];
      if (params.get('sets')) parts.push(params.get('sets') + ' sets');
      var work = params.get('reps') || params.get('work') || params.get('duration') || '';
      if (work) parts.push('× ' + work);
      if (params.get('rest')) parts.push('Rest ' + params.get('rest'));
      if (params.get('note')) parts.push(params.get('note'));
      session = parts.join(' · ');
    }
    var sessionHtml = session ? '<div class="session">' + esc(session) + '</div>' : '';
    app.innerHTML =
      '<h1>' + esc(ex.name) + '</h1>' +
      '<div class="chips"><span class="chip">' + esc(ex.target) + '</span><span class="chip">Equipment: ' + esc(ex.equipment) + '</span></div>' +
      sessionHtml +
      gif +
      '<h2>Steps</h2><ol>' + steps + '</ol>' +
      cueHtml + mistakeHtml +
      '<div class="src">GIF source: exercises-dataset on GitHub, media © Gym visual.' + idHtml + ' · <a href="index.html">Open the full Exercise Browser</a></div>';
  });
})();
</script>
</body>
</html>
